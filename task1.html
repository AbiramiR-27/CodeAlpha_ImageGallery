<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Image Gallery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    padding:30px;
    color:white;
}

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:32px;
}

/* FILTER BUTTONS */
.filter-buttons{
    text-align:center;
    margin-bottom:25px;
}

.filter-buttons button{
    padding:10px 18px;
    margin:6px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    background:white;
    color:#333;
    font-weight:bold;
    transition:0.3s;
}

.filter-buttons button:hover,
.filter-buttons button.active{
    background:#ff9800;
    color:white;
}

/* GALLERY GRID */
.gallery{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap:18px;
}

/* GALLERY ITEM */
.gallery-item{
    position:relative;
    overflow:hidden;
    border-radius:15px;
    cursor:pointer;
}

.gallery-item img{
    width:100%;
    height:250px;
    object-fit:cover;
    transition:0.4s ease;
}

/* Hover Overlay */
.overlay{
    position:absolute;
    bottom:0;
    width:100%;
    background:rgba(0,0,0,0.6);
    color:white;
    text-align:center;
    padding:10px;
    transform:translateY(100%);
    transition:0.4s ease;
}

.gallery-item:hover img{
    transform:scale(1.1);
}

.gallery-item:hover .overlay{
    transform:translateY(0);
}

/* LIGHTBOX */
.lightbox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

.lightbox img{
    max-width:80%;
    max-height:70%;
    border-radius:15px;
    margin-bottom:15px;
}

.lightbox button{
    padding:10px 20px;
    margin:5px;
    border:none;
    border-radius:20px;
    background:#ff9800;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

.lightbox button:hover{
    background:white;
    color:#333;
}

@media(max-width:600px){
    .lightbox img{
        max-width:95%;
    }
}
</style>
</head>
<body>

<h1>🌈 Creative Image Gallery</h1>

<div class="filter-buttons">
    <button class="active" onclick="filterImages('all',this)">All</button>
    <button onclick="filterImages('nature',this)">Nature</button>
    <button onclick="filterImages('city',this)">City</button>
    <button onclick="filterImages('animals',this)">Animals</button>
    <button onclick="filterImages('tech',this)">Technology</button>
    <button onclick="filterImages('food',this)">Food</button>
    <button onclick="filterImages('travel',this)">Travel</button>
</div>

<div class="gallery">

    <!-- Nature -->
    <div class="gallery-item nature"><img src="https://picsum.photos/id/1015/600/400" onclick="openLightbox(0)"><div class="overlay">Nature</div></div>
    <div class="gallery-item nature"><img src="https://picsum.photos/id/1022/600/400" onclick="openLightbox(1)"><div class="overlay">Nature</div></div>

    <!-- City -->
    <div class="gallery-item city"><img src="https://picsum.photos/id/1011/600/400" onclick="openLightbox(2)"><div class="overlay">City</div></div>
    <div class="gallery-item city"><img src="https://picsum.photos/id/1031/600/400" onclick="openLightbox(3)"><div class="overlay">City</div></div>

    <!-- Animals -->
    <div class="gallery-item animals"><img src="https://picsum.photos/id/1025/600/400" onclick="openLightbox(4)"><div class="overlay">Animals</div></div>
    <div class="gallery-item animals"><img src="https://picsum.photos/id/237/600/400" onclick="openLightbox(5)"><div class="overlay">Animals</div></div>

    <!-- Tech -->
    <div class="gallery-item tech"><img src="https://picsum.photos/id/180/600/400" onclick="openLightbox(6)"><div class="overlay">Technology</div></div>
    <div class="gallery-item tech"><img src="https://picsum.photos/id/250/600/400" onclick="openLightbox(7)"><div class="overlay">Technology</div></div>

    <!-- Food -->
    <div class="gallery-item food"><img src="https://picsum.photos/id/1080/600/400" onclick="openLightbox(8)"><div class="overlay">Food</div></div>
    <div class="gallery-item food"><img src="https://picsum.photos/id/292/600/400" onclick="openLightbox(9)"><div class="overlay">Food</div></div>

    <!-- Travel -->
    <div class="gallery-item travel"><img src="https://picsum.photos/id/1043/600/400" onclick="openLightbox(10)"><div class="overlay">Travel</div></div>
    <div class="gallery-item travel"><img src="https://picsum.photos/id/1056/600/400" onclick="openLightbox(11)"><div class="overlay">Travel</div></div>

</div>

<div class="lightbox" id="lightbox">
    <img id="lightbox-img">
    <div>
        <button onclick="prevImage()">Prev</button>
        <button onclick="nextImage()">Next</button>
        <button onclick="closeLightbox()">Close</button>
    </div>
</div>

<script>
const images = document.querySelectorAll('.gallery-item img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
let currentIndex = 0;

function openLightbox(index){
    currentIndex = index;
    lightbox.style.display = "flex";
    lightboxImg.src = images[currentIndex].src;
}

function closeLightbox(){
    lightbox.style.display = "none";
}

function nextImage(){
    currentIndex = (currentIndex + 1) % images.length;
    lightboxImg.src = images[currentIndex].src;
}

function prevImage(){
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    lightboxImg.src = images[currentIndex].src;
}

function filterImages(category,btn){
    const items = document.querySelectorAll('.gallery-item');
    const buttons = document.querySelectorAll('.filter-buttons button');

    buttons.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    items.forEach(item=>{
        if(category === 'all' || item.classList.contains(category)){
            item.style.display="block";
        }else{
            item.style.display="none";
        }
    });
}
</script>

</body>
</html>
